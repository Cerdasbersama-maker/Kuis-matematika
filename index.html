<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kuis Matematika</title>
</head>
<body>
  <h1>Kuis Matematika</h1>
  <p>1. Urutan pecahan terkecil ke terbesar dari bilangan 0,6 ; 55% ; 2/3 ; 0,58 adalah?</p>
  <input type="text" id="q1">
  <button onclick="cekJawaban()">Cek Jawaban</button>

  <p id="hasil"></p>

  <script>
    function cekJawaban() {
      var jawaban = document.getElementById("q1").value;
      if (jawaban == "55% ; 0,58 ; 0,6 ; 2/3") {
        document.getElementById("hasil").innerText = "Benar!";
      } else {
        document.getElementById("hasil").innerText = "Salah, coba lagi ya.";
      }
    }
  </script>
</body>
</html>
